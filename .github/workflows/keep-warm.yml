name: Keep the demo host warm

# The demonstration's fallback host is a free Render instance, and it has two
# properties a visitor's first click should not have to meet:
#
#  - it spins down after 15 idle minutes, and a sleeping instance pays the whole
#    start-up warm again — about 41 s on `0.1 CPU` — before it answers anything;
#  - the control tower's *first* read scans the country: 2.23 s of a whole core,
#    measured against the production build, so about 51 s on this host. While
#    that scan runs the process cannot answer Render's own health check, Render
#    withholds traffic after 15 s of failures, and every other visitor is
#    answered 502 by the proxy until it finishes (docs/DEPLOYMENT.md §8.8).
#
# One probe every five minutes closes both: `/healthz` keeps the instance from
# spinning down, and `/api/command` performs that first scan at a moment nobody
# is watching, so the memo answers a visitor's click instead of being filled by
# it. Neither path touches the model, so no Gemini quota is spent here.
#
# This is a convenience, not a guarantee. GitHub delays scheduled runs under
# load and disables schedules after 60 days without repository activity, and
# Actions minutes are unlimited here only because this repository is public. The
# fix that needs no pinger is §8.8's: hand the scan's event loop back between
# facilities, then warm it at start-up beside the store.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    name: Wake the instance and pay its first country scan
    runs-on: ubuntu-latest
    steps:
      - name: Probe the deployed host
        env:
          CIVORA_LIVE_URL: https://civora-web.onrender.com
        run: |
          set -u

          # A slow host is the thing being observed, not a failure of this job:
          # every probe reports what it saw and the step still exits 0.
          report=''

          probe() {
            path="$1"
            limit="$2"
            result="$(curl -sS -o /dev/null -w '%{http_code} in %{time_total}s, %{size_download} bytes' --max-time "$limit" "$CIVORA_LIVE_URL$path" 2>&1)" || result="no answer within ${limit}s"
            line="$(printf '%-16s %s' "$path" "$result")"
            printf '%s\n' "$line"
            report="$report$line"$'\n'
          }

          probe /healthz 30
          probe /api/command 180

          printf '## Deployed host probe\n\n```\n%s```\n' "$report" >>"$GITHUB_STEP_SUMMARY"
