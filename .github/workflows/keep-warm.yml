name: Keep the demo host warm

# The demonstration's fallback host is a free Render instance, and it has a property
# a visitor's first click should not have to meet: it spins down after 15 idle
# minutes, and a sleeping instance pays the whole start-up warm again — about 41 s on
# `0.1 CPU` — before it answers anything.
#
# One probe every five minutes keeps it awake. `/api/command` is probed as well, for
# two reasons that are smaller than the first but real: it confirms the tower actually
# serves rather than only reporting healthy, and it re-warms the tower's scan if a
# capture has moved the ledger's revision — the revision is what invalidates that memo,
# and the scan is 180 ms here but a couple of seconds at a tenth of a core. Neither
# path touches the model, so no Gemini quota is spent here. The start-up warm of the
# assembled views (§8.9) is what makes this probe a confirmation rather than the thing
# that pays for them.
#
# This is a convenience, not a guarantee. GitHub delays scheduled runs under load and
# disables schedules after 60 days without repository activity, and Actions minutes are
# unlimited here only because this repository is public.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    name: Wake the instance and pay its first country scan
    runs-on: ubuntu-latest
    steps:
      - name: Probe the deployed host
        env:
          CIVORA_LIVE_URL: https://civora-web.onrender.com
        run: |
          set -u

          # A slow host is the thing being observed, not a failure of this job:
          # every probe reports what it saw and the step still exits 0.
          report=''

          probe() {
            path="$1"
            limit="$2"
            result="$(curl -sS -o /dev/null -w '%{http_code} in %{time_total}s, %{size_download} bytes' --max-time "$limit" "$CIVORA_LIVE_URL$path" 2>&1)" || result="no answer within ${limit}s"
            line="$(printf '%-16s %s' "$path" "$result")"
            printf '%s\n' "$line"
            report="$report$line"$'\n'
          }

          probe /healthz 30
          probe /api/command 180

          printf '## Deployed host probe\n\n```\n%s```\n' "$report" >>"$GITHUB_STEP_SUMMARY"
