name: Keep the demo host warm

# The demonstration's fallback host is a free Render instance, and it has a property
# a visitor's first click should not have to meet: it spins down after 15 idle
# minutes, and a sleeping instance pays the whole start-up warm again — about 41 s on
# `0.1 CPU` — before it answers anything.
#
# One probe every five minutes keeps it awake, and that is the whole job. `/healthz`
# touches no store, no model and no scan, so it costs nothing to repeat forever.
#
# It deliberately does **not** probe `/api/command`. While this was being written the
# deployed revision still filled the tower's scan memo inside the first reader's
# request, and the evidence is in this file's own history: the probe triggered a 48–54 s
# scan every five minutes, the instance failed its health checks during it, restarted,
# lost the memo and did it again. The assembled views are warmed at start-up since
# `7aa0213` (`docs/DEPLOYMENT.md` §8.9), which is what the probe was standing in for —
# so a probe that can only make an older host worse is not worth the confirmation it
# gives on a current one.
#
# This is a convenience, not a guarantee. GitHub delays scheduled runs under load and
# disables schedules after 60 days without repository activity, and Actions minutes are
# unlimited here only because this repository is public.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    name: Wake the instance and pay its first country scan
    runs-on: ubuntu-latest
    steps:
      - name: Probe the deployed host
        env:
          CIVORA_LIVE_URL: https://civora-web.onrender.com
        run: |
          set -u

          # A slow host is the thing being observed, not a failure of this job:
          # the probe reports what it saw and the step still exits 0.
          result="$(curl -sS -o /dev/null -w '%{http_code} in %{time_total}s, %{size_download} bytes' --max-time 30 "$CIVORA_LIVE_URL/healthz" 2>&1)" || result='no answer within 30s'

          printf '/healthz %s\n' "$result"
          printf '## Keep-warm probe\n\n```\n/healthz %s\n```\n' "$result" >>"$GITHUB_STEP_SUMMARY"
